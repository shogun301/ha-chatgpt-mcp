[project]
name = "ha-chatgpt-mcp"
version = "2.6.3"
requires-python = ">=3.12"
dependencies = [
  "aiohttp>=3.12,<4",
  "argon2-cffi>=25,<26",
  "cryptography>=45,<46",
  "mcp>=2.0,<3",
  "PyJWT>=2.10,<3",
  "python-multipart>=0.0.20,<1",
  "starlette>=0.48,<1",
  "uvicorn[standard]>=0.35,<1",
]

[dependency-groups]
dev = ["pytest>=9,<10"]

[tool.pytest.ini_options]
testpaths = ["tests"]
