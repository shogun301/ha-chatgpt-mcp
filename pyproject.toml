[project]
name = "ha-chatgpt-mcp"
version = "2.7.3"
requires-python = ">=3.12"
dependencies = [
  "aiohttp>=3.12,<4",
  "argon2-cffi>=25,<26",
  "cryptography>=45,<46",
  "mcp>=2.0,<3",
  "PyJWT>=2.10,<3",
  "python-multipart>=0.0.20,<1",
  "starlette>=0.48,<1",
  "uvicorn[standard]>=0.35,<1",
]

[build-system]
requires = ["setuptools>=80,<83"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app", "app.*", "collector", "collector.*", "home_assistant.*"]
exclude = ["tests", "tests.*", "collector.tests", "home_assistant.tests", "cloudflare", "cloudflare.*"]
namespaces = true

[tool.setuptools.package-data]
collector = ["README.md", "ha-host-diagnostics.service"]
"home_assistant.custom_components.solaredge_one_bridge" = ["manifest.json", "strings.json", "translations/*.json"]
"home_assistant.wyzeapi_overlay" = ["README.md", "UPSTREAM_LICENSE", "NOTICE"]
"home_assistant.wyzeapi_overlay.custom_components.wyzeapi" = ["manifest.json", "services.yaml"]

[dependency-groups]
dev = ["pytest>=9,<10"]

[tool.pytest.ini_options]
testpaths = ["tests"]
